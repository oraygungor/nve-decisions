name: Monitor eInnsyn

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run monitor
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: |
          python monitor_einnsyn.py > latest_result.json

      - name: Ensure JSON exists
        run: |
          if [ ! -f latest_result.json ]; then
            echo "{}" > latest_result.json
          fi

      - name: Commit latest JSON
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add latest_result.json

          git diff --cached --quiet && echo "No changes to commit" && exit 0

          git commit -m "Update latest eInnsyn result"
          git push
